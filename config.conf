
# Site principal
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root ./www;
    index index.html;
    client_max_body_size 10M;

    error_page 404 ./www/errors/404.html;
    error_page 500 ./www/errors/500.html;

    # Page d'accueil et fichiers statiques
    location / {
        allowed_methods GET;
        autoindex off;
        index index.html;
    }

    # Page de contact
    location /contact {
        allowed_methods GET;
        root ./www;
    }

    # Répertoire dont on peut afficher le contenu
    location /directory {
        allowed_methods GET;
        root ./www;
        autoindex on;
        index index.html;
    }

    # Envoi de fichiers
    location /uploads {
        allowed_methods GET POST;
        root ./www;
        upload_enabled on;
        upload_store ./www/uploads;
    }

    # Redirection
    location /old-contact {
        return 301 /contact.html;
    }

    # Exécution CGI
    location .php {
        allowed_methods GET POST;
        cgi_extension .php;
        cgi_path /usr/bin/php-cgi;
    }
}

# Deuxième site, sur un autre port
server {
    listen 127.0.0.1:8081;
    server_name second.local;

    root ./www/second;
    index accueil.html;
    client_max_body_size 2M;

    error_page 404 ./www/second/404.html;

    location / {
        allowed_methods GET;
        autoindex off;
        index accueil.html;
    }

    location /files {
        allowed_methods GET;
        root ./www/second;
        autoindex on;
    }
}
